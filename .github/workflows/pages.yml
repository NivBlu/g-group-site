name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# configure-pages turns Pages on for the repo the first time this runs, so the
# site can be published without anyone touching repository settings.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the served site. The landing page's React source lives in
      # landing/ and has no business being on the public URL.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html about.html city-square.html contact.html projects.html style.css _site/
          cp -r images downtown _site/
          echo "Published files:"
          find _site -maxdepth 2 -type d | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
