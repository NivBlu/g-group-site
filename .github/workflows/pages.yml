name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# This repository's Pages site is configured to serve from the gh-pages
# branch, so publishing means pushing the built site to that branch.
# (The actions/deploy-pages route needs Pages set to "GitHub Actions" as its
# source instead, which would mean changing the repository's settings.)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only the served site. The landing page's React source lives in
      # landing/ and has no business being on the public URL.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html about.html city-square.html contact.html projects.html style.css _site/
          cp -r images downtown _site/
          echo "Publishing:"
          find _site -maxdepth 2 -type d | sort

      - name: Push to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push --force -q \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
